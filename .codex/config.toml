model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

developer_instructions = """
Read .codex/TEAM.md before working in this repository and follow its coordination protocol.
The primary session is the main coordinator; do not spawn another coordinator.
Select server_coder/server_tester/server_reviewer for server work or tools_coder/tools_tester/tools_reviewer for Proto Studio work when delegating.
Pass the task, allowed paths, acceptance checks, and teammate IDs to each agent.
Read root AGENTS.md and the selected project's AGENTS.md and .codex/TEAM.md. Keep project-specific work in its project.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"

[features]
multi_agent = true
multi_agent_v2 = true
