syntax = "proto3";

package game.model;

import "game/model/rbe.proto";
import "game/model/resource.proto";

option java_package = "com.game.server.proto";
option csharp_namespace = "Game.Server.Proto";

message UpdateProto {
  int32 type = 1;
  int64 time = 2;
  bytes data = 3;
}

// type = 0
message ResourceUpdateProto {
  string action = 1;
  repeated ResourceProto resource = 2;
}

// type = 1
message LevelUpdateProto {
  int32 level = 1;
  repeated ResourceProto reward = 2;
}

// type = 2
message RbeUpdateProto {
  repeated RbeEventProto rbe_event = 1;
}

// reserve to type = 1000
