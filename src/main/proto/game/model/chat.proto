syntax = "proto3";

package game.model;

option java_package = "com.game.server.proto";
option java_outer_classname = "ChatModel";
option csharp_namespace = "Game.Server.Proto";

message GearChatProto {
  string id = 1;
  string message = 2;
  int64 time = 3;
  string event = 4;
}

message ClanChatProto {
  GearChatProto gear_chat = 1;
  repeated StarProto star = 2;

  message StarProto {
    string id = 1;
    int64 time = 2;
  }
}

message ClanDonationProto {
  GearChatProto gear_chat = 1;
  map<string, int32> currency = 2;
  int64 expiry = 3;
  int64 claimed = 4;
  repeated DonatorProto donator = 5;

  message DonatorProto {
    string id = 1;
    map<string, int32> currency = 2;
    int64 time = 3;
  }
}
    
    