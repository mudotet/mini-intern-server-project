syntax = "proto3";
package game.app;
option java_package = "com.game.server.proto";
option csharp_namespace = "Game.Server.Proto";
import "game/blueprint/shop.proto";

message ShopDailyProtoResponse {
  // Active when cycle_start <= now < expires_at.
  int64 cycle_start = 1;
  int64 expires_at = 2;
  // Three offers with distinct package IDs.
  repeated ShopDailySlotResponse slots = 3;
  int64 server_time = 4;
  reserved 6;
  reserved "stock_is_initial";
}
message ShopDailySlotResponse {
  string slot_id = 1;
  DailyOfferProto offer = 2;
}
message DailyOfferProto {
  // daily:<cycle_start>:<slot_id>:<package_id>
  string offer_id = 1;
  string package_id = 2;
  reserved 3, 7;
  reserved "category", "display";
  game.blueprint.ShopPackage.Price original_price = 4;
  game.blueprint.ShopPackage.Price final_price = 5;
  // Resolved once per cycle, unchanged across reads and all three purchases.
  map<string, int32> items = 6;
  int32 discount_percent = 8;
  int32 purchased = 9;
  int32 remaining = 10;
  int32 purchase_limit = 11;
}
