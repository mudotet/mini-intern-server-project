syntax = "proto3";

package game.app;

option java_package = "com.game.server.proto";
option java_outer_classname = "CommonLoginContract";

message CommonLoginRequestProto {
  string player_id = 1;
  string device_id = 2;
  CommonLoginClientProto client = 3;
  // Optional; if supplied, must belong to this device.
  string account_id = 4;
}

message CommonLoginClientProto {
  string platform = 1;

  string identifier = 2;
  string version = 3;

  reserved 5;
  reserved "misc";
}

message CommonLoginResponseProto {
  reserved 1, 2, 3;
  reserved "asset", "odl", "odb";
  string device_id = 4;
  string player_id = 5;
  string access_token = 6;
  int64 session_expires_at = 7;
  // Account owns the returned player identity.
  string account_id = 8;
  bool new_account = 9;
}
