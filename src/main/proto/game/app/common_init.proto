syntax = "proto3";

package game.app;

option java_package = "com.game.server.proto";
option java_outer_classname = "CommonInitContract";

message CommonInitRequest {}

message CommonInitResponse {
  int64 server_time = 1;
  string contract_version = 2;
  string configuration_version = 3;
  string minimum_client_version = 4;
  bool maintenance = 5;
}
