syntax = "proto3";

package game.common;

option java_package = "com.game.server.proto";
option java_outer_classname = "ErrorContract";

message ApiError {
  ApiErrorCode code = 1;
  string message = 2;
}

enum ApiErrorCode {
  API_ERROR_CODE_UNSPECIFIED = 0;
  INVALID_REQUEST = 1;
  ACCOUNT_ID_MISMATCH = 2;
  UNAUTHORIZED = 3;
  SESSION_EXPIRED = 4;
  PLAYER_NOT_FOUND = 5;
  INTERNAL_ERROR = 6;
}
