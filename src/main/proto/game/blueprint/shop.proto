syntax = "proto3";
package game.blueprint;
option java_package = "com.game.server.proto";
option java_outer_classname = "ShopBlueprintContract";
option csharp_namespace = "Game.Server.Proto";

message ShopBlueprint {
  repeated ShopPackage packages = 1;
  DailyShopConfig daily = 2;
  StaticShopConfig static_shop = 3;
}

// Shared product definition. Static uses items; daily resolves quantity ranges.
message ShopPackage {
  string id = 1;
  reserved 2, 5, 6, 7;
  reserved "category", "schedule", "stock", "display";
  Price price = 3;
  // Default rewards for StaticShop, keyed by resource ID (gold/gem/xp).
  map<string, int32> items = 4;
  // Same resource IDs as items; positive inclusive min/max for DailyShop.
  map<string, RewardQuantityRange> daily_reward_ranges = 8;

  message Price {
    // Demo packages use exactly one positive gold or gem price.
    map<string, int32> currency = 1;
    reserved 2;
    reserved "iap";
  }
}

message RewardQuantityRange {
  int32 min = 1;
  int32 max = 2;
}

message StaticShopConfig {
  repeated StaticShopSlotConfig slots = 1;
}
message StaticShopSlotConfig {
  string slot_id = 1;
  string package_id = 2;
}

message DailyShopConfig {
  // Unix seconds aligned to 00:00 Asia/Ho_Chi_Minh.
  int64 cycle_anchor = 1;
  // Demo: 86400 seconds.
  int32 cycle_duration_seconds = 2;
  // Demo: exactly three distinct slot IDs.
  repeated DailyShopSlotConfig slots = 3;
  // Select three distinct package IDs uniformly without replacement.
  repeated DailyPackageCandidate candidates = 4;
  // Demo: three purchases per offer; never applied to StaticShop.
  int32 purchase_limit = 5;
  // Demo: [10, 20, 30], selected uniformly once per offer/cycle.
  repeated int32 discount_percentages = 6;
}
message DailyShopSlotConfig {
  string slot_id = 1;
  reserved 2, 3;
  reserved "package_id", "discount_options";
}
message DailyPackageCandidate {
  string package_id = 1;
  reserved 2, 3;
  reserved "selection_weight", "discount_options";
}
