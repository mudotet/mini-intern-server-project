syntax = "proto3";

package game.blueprint;

option java_package = "com.game.server.proto";
option java_outer_classname = "ChatBlueprintContract";
option csharp_namespace = "Game.Server.Proto";

message ChatBlueprint {
  repeated ChatChannel channel = 1;
}

message ChatChannel {
  string id = 1;
  int32 history_limit = 2;
  int32 message_length = 3;
  int32 send_cooldown = 4;
}